[project]
name = "austin-dumpster-fire-controller"
version = "0.1.0"
description = "Standalone Socrata to ESPHome activity controller"
requires-python = ">=3.11"
dependencies = [
  "aioesphomeapi==46.30.0",
  "anyio>=4.9,<5",
  "httpx2[http2,brotli,zstd]>=2.0,<3",
  "pydantic-settings>=2.8,<3",
]

[dependency-groups]
dev = ["basedpyright>=1.28", "ruff>=0.11"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "Linux"
include = ["."]
exclude = [".venv", "__pycache__"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", "ISC001", "D203", "D213", "CPY001",
  # Constructor/property implementations are documented by their class/protocol.
  "D105", "D107", "D102",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
